# ==========================================================================
# 后端部署：触发 Render 部署（Serverless / PaaS 方案，不需要自建服务器）
#   触发条件：backend/** 或 render.yaml 变更推送到 main，或手动触发
#   需要的 Secret：RENDER_DEPLOY_HOOK
#     Render 控制台 → 你的 Web Service → Settings → Deploy Hook，复制整条 URL
#   建议同时在 Render 里关闭 Auto-Deploy，否则一次推送会触发两次部署
#   未配置该 Secret 时安全跳过（不会出现失败的红叉）
#   注意：钩子成功时返回 202 Accepted，工作流按 2xx 判定成功
# ==========================================================================
name: Deploy backend to Render

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'render.yaml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check deploy hook secret
        id: check
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_DEPLOY_HOOK}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 RENDER_DEPLOY_HOOK，本次跳过后端部署。配置方法见 docs/github-integration.md"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          echo "触发 Render 部署…"
          code=$(curl -sS -o /tmp/render_resp.txt -w '%{http_code}' -X POST "$RENDER_DEPLOY_HOOK")
          cat /tmp/render_resp.txt || true
          # Render 的部署钩子成功时返回 202 Accepted（不是 200/201），
          # 所以这里按 2xx 判定；4xx 一般是钩子被轮换（需要更新 Secret）
          case "$code" in
            2*)
              echo "已触发 ✅ 构建进度见 https://dashboard.render.com"
              ;;
            *)
              echo "::error::Render 部署钩子返回 HTTP $code，部署未触发。"
              echo "排查顺序：1) 钩子是否被轮换（Render → Settings → Deploy Hook 重新复制）2) Secret 是否过期 3) Render 服务是否 suspended 4) 免费额度是否用尽"
              exit 1
              ;;
          esac
